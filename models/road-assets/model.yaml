# road-assets：道路资产检测。模型规格，人工维护；训练、发布与打包都从这里读取。
# 发布事实（产物、来源、指标）由发布工具写进 release.json，不手改。
schema: 1
id: road-assets
display_name: 道路资产检测
task: detect

# 顺序即类别号，发布后不能调换或删减：已部署的业务规则与历史数据按类别号解读。
# 名称同时是标注中的类别名与 OSD 显示的标签（labels.txt）。
classes:
  - 标志牌(绿底矩形)
  - 标志牌(菱形)
  - 标志牌(蓝底矩形)
  - 标志牌(圆牌)
  - 标志牌(白底矩形)
  - 标志牌(褐底矩形)
  - 标志牌(黄底矩形)
  - 龙门架A
  - 龙门架B
  - 龙门架C
  - 龙门架D
  - 摄像头(龙门架A)
  - 摄像头(挂架)
  - 摄像头(柱)
  - 摄像头(横梁机组)
  - 摄像头(龙门架D)
  - 摄像头(球机)
  - 摄像头(横梁单机)
  - 防撞桶
  - 防撞垫
  - 防眩板缺失
  - 防眩板断裂
  - 防眩板歪斜
  - 混凝土护栏破损
  - 波形梁护栏破损
  - 波形梁护栏坠落
  - 金属梁护栏破损

# 部署契约：网络输入尺寸与输出布局。plugins/yolo-parser 只接受 xyxy-confidence-class_id
# （唯一输出层 [batch, 候选数, 6]）；导出时按它追加转换，发布时校验导出的 ONNX 与之一致。
input: {width: 640, height: 640}
output_layout: xyxy-confidence-class_id

# 数据集：训练根目录 sources/ 下的这些来源（X-AnyLabeling 标注）；标注中的其他类别名报错，
# ignore_classes 中的丢弃。划分按采集组（导入时确定：同一视频、同一目录或同一文件名前缀）的哈希决定，
# 加入新来源时已有样本的划分不变（docs/training.md §6）。
data:
  sources: [road-assets]
  ignore_classes: [待定]
  split:
    val: 0.15
    test: 0.15
    seed: 42

# 训练：backend 选择训练后端；options 原样交给后端（这里是 Ultralytics 的 train 参数）。
train:
  backend: ultralytics
  weights: yolo11s.pt
  options:
    epochs: 200
    batch: 16
    imgsz: 640
    patience: 50
    workers: 8
    optimizer: auto
    cache: false
    hsv_h: 0.0138
    hsv_s: 0.664
    hsv_v: 0.464
    degrees: 0.2
    translate: 0.2
    scale: 0.8
    shear: 0.0
    perspective: 0.0
    flipud: 0.0
    fliplr: 0.5
    mosaic: 1.0
    mixup: 0.1
    close_mosaic: 10

# 发布门槛：在本次数据集的测试划分上评估。min 是绝对下限；regression 与 release.json 中的
# 当前模型在同一测试划分上重新评估后比较（没有当前模型时跳过）。
evaluate:
  gate:
    min: {}
    regression: {metric: map50_95, max_drop: 0.01}

export:
  format: onnx
  opset: 17
  batch: 1
  dynamic: false
  simplify: true
