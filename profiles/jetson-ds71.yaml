# profile：Jetson（JetPack 6.1+），DeepStream 7.1，host 网络
# host 网络让本方案不依赖 Docker bridge（部分 Jetson 内核缺少它所需的模块）；宿主的 Docker 配置见
# docs/deployment.md。镜像须为 arm64：在 arm64 机器上构建，用 build-release.sh --with-base 打包。
# Orin Nano 没有硬件编码器（NVENC）：在它上面关闭应用配置中的 rtsp_out 与录像。
x-platform: arm64
x-build:
  DEEPSTREAM_IMAGE: nvcr.io/nvidia/deepstream:7.1-samples-multiarch
# 所有服务（包括以后新增的单元）都不连 bridge；显式 network_mode 的服务保持不变。
# 渲染器同时把每个服务名指向 127.0.0.1（extra_hosts），配置照常用 redis、mediamtx 等服务名。
x-network-mode: host
services:
  # 非 root 用户访问 /dev/nvhost-*、编解码器等 Jetson 设备；runtime: nvidia 由单元自己声明。
  example-app:
    group_add: [video]
  model-engine-builder:
    group_add: [video]
  # host 网络下监听会直接暴露到现场网络：Redis 只绑定回环地址。
  redis:
    environment:
      REDIS_EXTRA_ARGS: --bind 127.0.0.1
  # 只保留 RTSP（8554/tcp 与 8000-8001/udp）；ports 映射在 host 网络下不再生效。推流仍需口令。
  # 要在其他机器用浏览器（WebRTC）查看时删除 MTX_WEBRTC 一行，并在宿主防火墙放行 8889/tcp、8189/udp；
  # host 网络下 MediaMTX 自动通告宿主网卡地址，不必设置 MEDIAMTX_HOST。
  mediamtx:
    environment:
      MTX_RTMP: "no"
      MTX_HLS: "no"
      MTX_WEBRTC: "no"
      MTX_SRT: "no"
