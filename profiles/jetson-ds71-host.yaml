# profile：Jetson（JetPack 6.1+），DeepStream 7.1，host 网络（内核不支持 Docker bridge 时使用）
# 宿主须先在 /etc/docker/daemon.json 中设置 "bridge": "none", "iptables": false 并安装 NVIDIA runtime；
# 镜像在编译服务器上构建，用 build-release.sh --with-base 打包，不在 Jetson 上构建。
x-build:
  DEEPSTREAM_IMAGE: nvcr.io/nvidia/deepstream:7.1-samples-multiarch
  # host 网络下服务名不能解析，本机服务用回环地址；这些也是交互安装的提问默认值。
  REDIS_HOST: 127.0.0.1
  RTSP_URL: rtsp://127.0.0.1:8554/camera0
# 所有服务（包括以后新增的单元）都不连 bridge；显式 network_mode 的服务保持不变。
x-network-mode: host
x-app-config:
  example-app:
    rtsp_out:
      url: rtsp://publisher@127.0.0.1:8554/${CAMERA_ID}-out
services:
  example-app:
    runtime: nvidia
    group_add: [video]  # 非 root 用户访问 /dev/nvhost-*、编解码器等 Jetson 设备
  model-engine-builder:
    runtime: nvidia
    group_add: [video]
  # host 网络下监听会直接暴露到现场网络：Redis 默认没有口令，只绑定回环地址。
  redis:
    environment:
      REDIS_EXTRA_ARGS: --bind 127.0.0.1
  # 只保留 RTSP（8554/tcp 与 8000-8001/udp）；ports 映射在 host 网络下不再生效。推流仍需口令。
  mediamtx:
    environment:
      MTX_RTMP: "no"
      MTX_HLS: "no"
      MTX_WEBRTC: "no"
      MTX_SRT: "no"
