# __NAME__ 配置模板；${VAR} 来自 project.env、profile 与 site-fields.env。
logging:
  level: info

# 就绪帧计数超过该秒数不增长时退出，由容器重启恢复；接入实时源时设为明显长于重连时间的值。0 关闭。
watchdog:
  stall_timeout_s: 0

# 就绪默认只要求应用活着（没有输入也算就绪，适合线阵、外触发等按需产帧的源）；true 时还要求帧计数在增长。
readiness:
  require_input: false

sources:
  - id: test0
    type: test   # 换成 rtsp/file/v4l2 接入真实视频
    # properties: {pattern: ball}   # 可选：透传给源插件的属性

mux:
  width: 1280
  height: 720

# 推理链：每项 {name, plugin, config_path, properties}，按顺序串接。
inference: []
