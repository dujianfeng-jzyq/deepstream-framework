# 框架级服务：base 运行环境、载荷播种与 engine 预构建。
# 服务单元的定义在 services/*/compose.yaml，平台差异在 profiles/<name>.yaml，镜像的构建定义在
# framework/docker/build.compose.yaml（只在开发机）；渲染器按顺序把它们写进 .env 的 COMPOSE_FILE，
# 直接使用 docker compose 即可。

name: ${PROJECT_NAME}

services:
  # 构建目标与运行时父镜像；启动后立即成功退出，使开发机上 `docker compose up -d --build` 可用。
  deepstream-base:
    image: ${BASE_IMAGE}
    entrypoint: ["/bin/true"]
    restart: "no"

  # 载荷镜像：只向空的 app-files 卷播种程序，然后退出。
  deepstream-apps:
    image: ${APPS_IMAGE}
    network_mode: none
    restart: "no"
    volumes:
      - app-files:${CONTAINER_WORKSPACE}

  # 按模型目录中的 nvinfer 配置预构建 engine；业务服务等它成功退出后再启动。
  model-engine-builder:
    image: ${BASE_IMAGE}
    user: "${HOST_UID}:${HOST_GID}"  # engine 与指纹归现场用户，业务容器才能读取
    restart: "no"
    runtime: nvidia
    depends_on:
      deepstream-apps:
        condition: service_completed_successfully
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - app-files:${CONTAINER_WORKSPACE}:ro
      - ./models:${CONTAINER_MODELS_PATH}  # 允许相对的 model-engine-file 写在模型目录内
      - ${HOST_DATA_PATH}:${CONTAINER_DATA_PATH}
      - /etc/localtime:/etc/localtime:ro
    working_dir: ${CONTAINER_WORKSPACE}
    command: [python3, tools/prepare_model_engines.py, --models-path, "${CONTAINER_MODELS_PATH}"]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

volumes:
  # 默认卷名 <PROJECT_NAME>_app-files。卷只在为空时播种：更换载荷必须删除这个卷
  # （安装器只删它；docker compose down -v 会连同服务的其他命名卷一起删除）。
  app-files:
