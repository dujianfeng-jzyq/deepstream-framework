# 框架级服务：base 运行环境、载荷播种与 engine 预构建。
# 服务单元的定义在 services/*/compose.yaml，平台差异在 profiles/<name>.yaml；
# 渲染器按这个顺序把它们写进 .env 的 COMPOSE_FILE，直接使用 docker compose 即可。

name: ${PROJECT_NAME}

services:
  # 构建目标与运行时父镜像；启动后立即成功退出，使 `docker compose up -d --build` 可用。
  deepstream-base:
    image: ${BASE_IMAGE}
    build:
      context: .
      dockerfile: framework/docker/base.Dockerfile
      args:
        DEEPSTREAM_IMAGE: ${DEEPSTREAM_IMAGE}
        BASE_APT_PACKAGES: ${BASE_APT_PACKAGES}
    entrypoint: ["/bin/true"]
    restart: "no"

  # 载荷镜像：只向空的 app-files 卷播种程序，然后退出。
  # additional_contexts 把 FROM ${BASE_IMAGE} 绑定到本次 base 构建结果（构建依赖，不是运行依赖）。
  deepstream-apps:
    image: ${APPS_IMAGE}
    build:
      context: .
      dockerfile: framework/docker/apps.Dockerfile
      additional_contexts:
        - "${BASE_IMAGE}=service:deepstream-base"
      args:
        BASE_IMAGE: ${BASE_IMAGE}
        APPS_VERSION: ${APPS_VERSION}
        PIP_INDEX_URL: ${PIP_INDEX_URL}
    network_mode: none
    restart: "no"
    volumes:
      - app-files:${CONTAINER_WORKSPACE}

  # 按模型目录中的 nvinfer 配置预构建 engine；业务服务等它成功退出后再启动。
  model-engine-builder:
    image: ${BASE_IMAGE}
    user: "${HOST_UID}:${HOST_GID}"  # engine 与指纹归现场用户，业务容器才能读取
    restart: "no"
    depends_on:
      deepstream-apps:
        condition: service_completed_successfully
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - app-files:${CONTAINER_WORKSPACE}:ro
      - ./models:${CONTAINER_MODELS_PATH}  # 允许相对的 model-engine-file 写在模型目录内
      - ${HOST_DATA_PATH}:${CONTAINER_DATA_PATH}
      - /etc/localtime:/etc/localtime:ro
    working_dir: ${CONTAINER_WORKSPACE}
    command: [python3, tools/prepare_model_engines.py, --models-path, "${CONTAINER_MODELS_PATH}"]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

volumes:
  # 默认卷名 <PROJECT_NAME>_app-files。卷只在为空时播种：更换载荷必须 docker compose down -v。
  app-files:
