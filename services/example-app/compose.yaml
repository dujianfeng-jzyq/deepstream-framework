services:
  example-app:
    extends: {file: framework/compose/defaults.yaml, service: dsf-service}
    runtime: nvidia  # 需要 GPU 的单元自己声明运行时；平台差异（设备、用户组）写在 profile
    entrypoint: [bin/example-app]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    volumes:
      - ./models:${CONTAINER_MODELS_PATH}:ro
    depends_on:  # 与公共定义中的依赖合并
      model-engine-builder:
        condition: service_completed_successfully
      # Redis 断开时发布器自行重连；RTSP 输出断开时应用排空后退出，由重启策略恢复推流。
      # 删除对应单元时依赖自动失效。
      redis:
        condition: service_started
        required: false
      mediamtx:
        condition: service_started
        required: false
