# example-app 配置模板。${VAR} 来自 project.env、profile 与现场参数（site-fields.env）。
# 字段与默认值由 src/config.cpp 与框架块定义。sources[i]、mux、inference[i]、tracker、analytics、osd、
# encoder、recording、rtsp_out、rtsp_out.tiler、redis.image（采集点前的 queue）都可以加 properties: {属性: 值}，
# 设置对应插件的任意属性；不需要时省略。

logging:
  level: info
  console: true
  file: false
  directory: ${CONTAINER_DATA_PATH}/logs
  stats_interval_s: 60

# 帧计数 5 分钟不增长时退出，由容器重启恢复（Docker 不会重启 unhealthy 的容器）。
# 应明显长于 RTSP 的正常重连时间；0 关闭。
watchdog:
  stall_timeout_s: 300

# 视频源列表；序号即 mux 的输入编号。增加一项即成为多路应用。
sources:
  - id: ${CAMERA_ID}
    type: rtsp
    # 地址中不要写口令，口令填在 rtsp.password，程序在运行时注入。
    uri: ${RTSP_URL}
    rtsp:
      password: ${RTSP_PASSWORD}
      latency_ms: 200
      tcp: true
      reconnect_interval_s: 5
    output:
      width: 1920
      height: 1080

# mux 输出尺寸就是消息中 bbox 的坐标空间。
mux:
  width: 1920
  height: 1080
  batched_push_timeout_us: 40000
  gpu_id: 0

# 推理链，按顺序串接（一级检测 + 可选的二级分类）。engine 由 model-engine-builder 预构建。
inference:
  - name: pgie
    plugin: nvinfer
    config_path: ${CONTAINER_MODELS_PATH}/road-assets/deployment/config.txt

tracker:
  enabled: true
  ll_lib_file: /opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so
  ll_config_file: /opt/nvidia/deepstream/deepstream/samples/configs/deepstream-app/config_tracker_NvDCF_perf.yml
  width: 640
  height: 384

analytics:
  enabled: false
  config_file: ""

osd:
  enabled: true

# 录像与 RTSP 输出共用的编码参数；Jetson 与 dGPU 的编码器属性差异写在 properties。
# 经 MediaMTX 在浏览器中用 WebRTC 查看时保持 h264：多数浏览器的 WebRTC 不能播放 h265。
encoder:
  codec: h264
  bitrate: 8000000
  iframe_interval: 30
  # 输入断流超过该时长后恢复时，恢复后的第一帧编成关键帧（录像据此切分，观看端立即恢复画面）；0 关闭。
  keyframe_on_gap_ms: 1000
  # properties: {preset-id: 1}

recording:
  root: ${CONTAINER_DATA_PATH}/recordings
  segment_seconds: 60
  # 输入断流超过该时长后恢复时开始新分段：断流前的分段只含断流前的画面，事件中的时长不含断流。
  # 不小于 encoder.keyframe_on_gap_ms，切分才正好落在恢复后的第一帧；0 关闭。
  split_on_gap_ms: 2000
  # 每个录像器（每路源的每个分支）独立计数。保留最新 keep_files 个分段；超过 max_files 时在其余分段中
  # 先删无目标的、再删有目标的（文件名带 -detected）。剩余空间低于 min_free_mb 时继续删，可删到最新的分段。
  # 0 表示不限制。每个分段约 segment_seconds × 码率，例如 60 s × 8 Mbps ≈ 60 MB，1440 个约 86 GB。
  retention:
    max_files: 1440
    keep_files: 60
    min_free_mb: 5120
  # 每个开启的分支每路源各用一个硬件编码器，RTSP 输出再用一个：N 路同时开 raw 与 osd 需要 2N+1 个编码会话。
  # GeForce 显卡限制同时打开的 NVENC 会话数，超出时编码器无法启动；Jetson 各型号的编码能力不同（Orin Nano 没有 NVENC）。
  raw: false
  osd: true

rtsp_out:
  enabled: true
  # 推到本工程的 MediaMTX：用户名 publisher，口令单独填写（运行时编码进地址，日志中打码）。
  url: rtsp://publisher@mediamtx:8554/${CAMERA_ID}-out
  password: ${MEDIAMTX_PUBLISH_PASSWORD}
  tiler:
    width: 1920
    height: 1080

redis:
  enabled: true
  host: redis
  port: 6379
  password: ${REDIS_PASSWORD}
  detection_stream: ${PROJECT_NAME}:detections
  recording_stream: ${PROJECT_NAME}:recordings
  only_on_detection: true
  queue_capacity: 256
  queue_bytes_mb: 64
  # Stream 只吸收消费端的短暂抖动（XADD MAXLEN ~，实际长度可能略多于该值），不是存储。
  max_length: 100
  # 有目标的帧整帧编码为 JPEG（Jetson 硬件 / dGPU nvJPEG），作为同一条记录的 image 字段（二进制）发送；
  # payload 中的 image 描述尺寸与大小。图片在 OSD 之前编码，不含框，坐标与 bbox 一致。
  image:
    enabled: false
    quality: 85
    width: 0     # 0 保持 mux 输出尺寸
    height: 0
